<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous">
    <title>House Price Prediction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-image:
                linear-gradient(135deg, rgba(5, 9, 28, 0.72), rgba(0, 0, 0, 0.42)),
                url('houseproj.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 28px 14px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(0, 123, 255, 0.28), transparent 34%),
                radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.16), transparent 30%);
            pointer-events: none;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 22px;
            font-weight: 800;
            letter-spacing: 0.4px;
            line-height: 1.2;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        }

        .container {
            position: relative;
            background: rgba(8, 13, 28, 0.82);
            padding: 34px;
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
            max-width: 860px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #007bff, #66d9ff, #ffffff);
        }

        form {
            margin-top: 15px;
            color: white;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .form-group {
            margin-bottom: 0;
        }

        label {
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.92rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            box-shadow: none;
            transition: all 0.22s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.58);
        }

        .form-control:focus {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.17);
            border-color: #66d9ff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.22);
        }

        select.form-control {
            cursor: pointer;
        }

        select.form-control option {
            color: #111827;
            background: #ffffff;
        }

        button {
            background: linear-gradient(135deg, #007bff, #0056d6);
            color: white;
            border: 0;
        }

        .btn-primary {
            grid-column: 1 / -1;
            height: 50px;
            border-radius: 15px;
            font-weight: 800;
            letter-spacing: 0.4px;
            box-shadow: 0 14px 28px rgba(0, 123, 255, 0.28);
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: linear-gradient(135deg, #1687ff, #004dbf);
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(0, 123, 255, 0.36);
            filter: brightness(1.05);
        }

        #outputColumn {
            margin-top: 18px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
        }

        #outputLabel {
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: #d8f3ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.78rem;
        }

        #output {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            background-color: rgba(0, 123, 255, 0.18);
        }

        .alert {
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 18px 12px;
            }

            .container {
                padding: 28px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.75rem;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mumbai Real Estate Price Prediction</h1>
        <form action="/" method="POST">
            <div class="form-group">
                <label for="title">Enter Area of Property</label>
                <input type="text" class="form-control" id="area" name="area" aria-describedby="emailHelp"
                    placeholder="In square feet">
            </div>
            <div class="form-group">
                <label for="desc">Enter Number of Bedrooms</label>
                <input type="text" class="form-control" id="bedroom" name="bedroom" placeholder="Whole Number Value">
            </div>
            <div class="form-group">
                <label for="title">Enter Number of Bathrooms</label>
                <input type="text" class="form-control" id="bathroom" name="bathroom" aria-describedby="emailHelp"
                    placeholder="Whole Number Value">
            </div>
            <div class="form-group">
                <label for="furnish">Select Furnished Status of the Property</label>
                <select class="form-control" id="furnish" name="furnish">
                    <option value="1">Unfurnished</option>
                    <option value="2">Semi-Furnished</option>
                    <option value="3">Furnished</option>
                </select>
            </div>
            <div class="form-group">
                <label for="algo">Pick Algorithm to be Used for Prediction</label>
                <select class="form-control" id="algo" name="algo">
                    <option value="0">Linear Regression</option>
                    <option value="1">Decision Tree Regressor</option>
                    <option value="2">Random Forest Regressor</option>
                    <option value="3">Support Vector Regressor</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <!-- Output Column -->
        <div id="outputColumn" class="form-group">
            <label id="outputLabel" for="output">Predicted Price</label>
            <input type="text" class="form-control" id="output" name="output" value="{{ pred[0] }}" readonly>
        </div>
        <div id="outputColumn" class="form-group">
            <label id="outputLabel" for="output">R2 Score</label>
            <input type="text" class="form-control" id="output" name="output" value="{{ mse }}" readonly>
        </div>
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
</body>
</html>
